<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetPush</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
          </svg>
        </div>
        <div class="brand-info">
          <h2>LeetPush</h2>
          <span class="version-tag">v1.0</span>
        </div>
      </div>
      <div class="status-pill" id="status-pill">
        <span class="status-dot pulsing" id="status-dot"></span>
        <span id="status-text">Checking...</span>
      </div>
    </header>

    <!-- Target Repository Card -->
    <div class="card repo-card">
      <div class="card-row">
        <span class="label">Repository</span>
        <a href="#" id="repo-link" class="value code-link" target="_blank" rel="noopener">
          <span id="repo-display">RIKKY-J/LeetPush</span>
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3" />
          </svg>
        </a>
      </div>
      <div class="card-row">
        <span class="label">Branch</span>
        <span class="value code" id="branch-display">main</span>
      </div>
      <div class="card-row">
        <span class="label">Sync Bridge</span>
        <span class="value" id="bridge-display">Companion Server</span>
      </div>
    </div>

    <!-- Last Submission Card -->
    <div class="section-title">LAST SUBMISSION</div>
    <div class="card last-submission-card" id="last-submission-box">
      <div class="submission-empty" id="submission-empty">
        <p>No recent submissions synced yet.</p>
        <span class="subtext">Solve any problem on LeetCode to auto-sync!</span>
      </div>
      <div class="submission-content" id="submission-content" style="display: none;">
        <div class="submission-header">
          <h4 id="sub-title">Two Sum</h4>
          <span class="badge" id="sub-lang">Python3</span>
        </div>
        <div class="submission-meta">
          <span class="badge-success" id="sub-status">✅ Pushed</span>
          <span class="time-ago" id="sub-time">Just now</span>
        </div>
        <div class="submission-path" id="sub-path">leetcode/two-sum/solution.py</div>
        <a href="#" id="sub-view-btn" class="sub-link" target="_blank" rel="noopener">View File on GitHub →</a>
      </div>
    </div>

    <!-- Actions -->
    <div class="action-buttons">
      <button id="open-github-btn" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
        </svg>
        Open GitHub
      </button>
      <button id="open-settings-btn" class="btn btn-primary">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        Settings
      </button>
    </div>

    <!-- Quick Sync Current Tab Button -->
    <button id="sync-current-tab-btn" class="btn btn-sync-tab">
      ⚡ Push Active Problem
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
